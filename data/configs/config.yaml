# =============================================================================
# CONFIRMATORY STUDY — The Price of Diversity (cross-provider, 3 configs)
# Frozen at Phase-1 prereg. analyze.py is a pure function of (runs.csv, config.yaml).
# =============================================================================

seed_master: 20260703
bootstrap_seed: 42            # fixed RNG for the cluster bootstrap (pre-registered)
seed_mode: per_agent         # unique derived seed per agent per call (independent draws)
temperature: 0.7
runs: 3
seeds: [101, 202, 303]       # base seed per run; per-agent seed derived from these

forward_return_days: 20

# --- Grid: 100 tickers stratified across 11 GICS sectors (see sectors map) -----
#     Enlarged from 50 -> 100 so the ticker-clustered bootstrap has enough clusters
#     to power the pre-registered Δκ endpoint (mini-pilot v1 implied ~1,097 cells).
tickers: [
  AAPL, MSFT, NVDA, AVGO, CRM, ORCL, ADBE, AMD, CSCO, ACN,      # Info Tech (10)
  JPM, BAC, WFC, GS, MS, C, AXP, SCHW, BLK, SPGI,               # Financials (10)
  XOM, CVX, COP, SLB, EOG, MPC, PSX, WMB, OXY,                  # Energy (9)
  LIN, SHW, FCX, NEM, APD, ECL, DOW, NUE,                       # Materials (8)
  CAT, BA, HON, UNP, GE, RTX, DE, LMT, UPS, ETN,                # Industrials (10)
  NEE, DUK, SO, D, AEP, EXC, SRE, XEL,                          # Utilities (8)
  UNH, JNJ, LLY, PFE, ABBV, MRK, TMO, ABT, DHR, BMY,            # Health Care (10)
  AMZN, TSLA, HD, MCD, NKE, LOW, SBUX, BKNG, TJX, GM,           # Cons Disc (10)
  PG, KO, PEP, COST, WMT, MDLZ, CL, MO, TGT,                    # Cons Staples (9)
  GOOGL, META, NFLX, DIS, CMCSA, VZ, T, TMUS,                   # Comm Svcs (8)
  PLD, AMT, EQIX, SPG, O, CCI, PSA, DLR,                        # Real Estate (8)
]

sectors:
  Information Technology: [AAPL, MSFT, NVDA, AVGO, CRM, ORCL, ADBE, AMD, CSCO, ACN]
  Financials: [JPM, BAC, WFC, GS, MS, C, AXP, SCHW, BLK, SPGI]
  Energy: [XOM, CVX, COP, SLB, EOG, MPC, PSX, WMB, OXY]
  Materials: [LIN, SHW, FCX, NEM, APD, ECL, DOW, NUE]
  Industrials: [CAT, BA, HON, UNP, GE, RTX, DE, LMT, UPS, ETN]
  Utilities: [NEE, DUK, SO, D, AEP, EXC, SRE, XEL]
  Health Care: [UNH, JNJ, LLY, PFE, ABBV, MRK, TMO, ABT, DHR, BMY]
  Consumer Discretionary: [AMZN, TSLA, HD, MCD, NKE, LOW, SBUX, BKNG, TJX, GM]
  Consumer Staples: [PG, KO, PEP, COST, WMT, MDLZ, CL, MO, TGT]
  Communication Services: [GOOGL, META, NFLX, DIS, CMCSA, VZ, T, TMUS]
  Real Estate: [PLD, AMT, EQIX, SPG, O, CCI, PSA, DLR]

# --- 8 analysis dates: all strictly AFTER latest model cutoff (2025-08, VERIFY via
#     probe) and ON/BEFORE 2026-06-01 so every 20-td forward window has closed.
#     Regime justification per date (see appendix/grid.csv / preregistration.md). ---
dates: ["2026-01-09", "2026-01-23", "2026-02-06", "2026-02-20",
        "2026-03-06", "2026-03-20", "2026-04-03", "2026-04-17",
        "2026-05-01", "2026-05-15", "2026-05-22", "2026-05-29"]

date_regimes:
  "2026-01-09": "Early-year risk-on positioning."
  "2026-01-23": "Pre-Q4-earnings drift."
  "2026-02-06": "Q4 2025 earnings season; rate-path repricing."
  "2026-02-20": "Post-earnings rotation."
  "2026-03-06": "AI-capex expansion phase; semis leadership."
  "2026-03-20": "Late-Q1 breadth broadening."
  "2026-04-03": "Q2 positioning."
  "2026-04-17": "Q1 2026 earnings / AI-capex peak."
  "2026-05-01": "Onset of energy supply-shock regime (Iran / Strait of Hormuz)."
  "2026-05-15": "Energy supply-shock phase; defensive rotation."
  "2026-05-22": "Supply-shock persistence."
  "2026-05-29": "Late-May consolidation."

# --- Ensemble configs (5 agents each). Heterogeneity = # non-OpenAI agents. ---
configs:
  HOM:                                   # heterogeneity level 0
    - {model: gpt-5.4-nano}
    - {model: gpt-5.4-nano}
    - {model: gpt-5.4-nano}
    - {model: gpt-5.4-nano}
    - {model: gpt-5.4-nano}
  HET-LITE:                              # heterogeneity level 1
    - {model: gpt-5.4-nano}
    - {model: gpt-5.4-nano}
    - {model: gpt-5.4-nano}
    - {model: gpt-5.4-nano}
    - {model: gemini-3.5-flash}
  HET:                                   # heterogeneity level 3
    - {model: gpt-5.4-nano}
    - {model: gpt-5.4-nano}
    - {model: gemini-3.5-flash}
    - {model: gemini-3.5-flash}
    - {model: grok-4.3}

heterogeneity_level: {HOM: 0, HET-LITE: 1, HET: 3}

# --- CONTROL for the capability-vs-provider confound (reviewer-requested) --------
# HET-SAMETIER: 5 EFFICIENT-tier models across 3 providers, so provider diversity is
# varied while holding capability tier ~constant. Compare its κ against HOM's κ:
# if κ still drops materially, the de-correlation is provider-driven, not tier-driven.
# To run this control WITHOUT disturbing the frozen main study, put it in a separate
# config file (e.g. config_control.yaml) with ONLY {HOM, HET-SAMETIER} in `configs:`,
# add the two efficient models to `models:` (VERIFY exact strings via probe_models.py),
# and run `python orchestrator.py --phase full` against that file. ~$5, ~15 min.
# control_configs:
#   HET-SAMETIER:                          # provider-diverse, capability-matched
#     - {model: gpt-5.4-nano}              # OpenAI efficient
#     - {model: gpt-5.4-nano}
#     - {model: gemini-3.1-flash-lite}     # Google efficient   (VERIFY string)
#     - {model: gemini-3.1-flash-lite}
#     - {model: grok-4.1-fast}             # xAI efficient      (VERIFY string)

# --- Model registry (VERIFY strings/pricing/cutoffs via probe_models.py) -------
models:
  gpt-5.5:
    provider: openai
    api_model: "gpt-5.5"
    knowledge_cutoff: "2025-08-01"    # VERIFY
    price_in: 5.0
    price_out: 30.0
    max_tokens: 3000
  gpt-5.4-nano:
    provider: openai
    api_model: "gpt-5.4-nano"
    knowledge_cutoff: "2025-08-01"    # VERIFY
    price_in: 0.20
    price_out: 1.25
    max_tokens: 256                   # ~40-token JSON output; 256 is ample headroom
  # (gemini flagship/pro was inventory-only and not available on this account;
  #  no config uses it, so it is intentionally omitted. Add back a verified pro
  #  string here if you want it recorded in the manifest.)
  gemini-3.5-flash:
    provider: google
    api_model: "gemini-3.5-flash"
    knowledge_cutoff: "2025-01-01"    # VERIFY
    price_in: 1.5
    price_out: 9.0
    max_tokens: 256                   # thinking disabled; ~40-token JSON output
  grok-4.3:
    provider: xai
    api_model: "grok-4.3"
    knowledge_cutoff: "2025-06-01"    # VERIFY
    price_in: 1.25
    price_out: 2.50
    max_tokens: 256
    reasoning_effort: "low"

# --- Phase 1.5 mini-pilot (reuses the cached pilot cells) ---------------------
minipilot:
  tickers: [AAPL, MSFT, JPM, XOM, UNH, CAT, GOOGL, PG]
  dates: ["2026-04-17", "2026-05-15"]
  runs: 3
  spend_cap_usd: 8.0
  gate:
    max_cells: 1200          # power must be reachable within the planned 1,200-cell grid
    max_cost_usd: 75.0
  paths:
    runs_csv: "data/minipilot/latest/runs.csv"
    spend_ledger: "data/minipilot/latest/spend_ledger.json"

# --- Phase 2 full study -------------------------------------------------------
spend_cap_usd: 90.0           # hard cap for the single confirmatory execution
stop_margin_usd: 1.0
midrun_report_at: 0.50
max_retries: 5
concurrency: 24               # parallel worker threads (override with --concurrency)

# Per-provider request-rate caps (requests/min). Keeps the run under org limits;
# workers self-throttle via a shared limiter. OpenAI org cap is 500 RPM / 200k TPM
# for gpt-5.4-nano -> 450 leaves margin.
rpm_limits:
  openai: 450
  google: 250
  xai: 300

# Provider DAILY request caps (per model key). Pre-flight aborts if the grid's
# planned calls for a model exceed its daily limit (unless --allow-over-quota).
# gemini-3.5-flash free tier = 10,000/day; the full grid needs ~10,800 gemini calls,
# so this run WOULD have aborted at launch instead of degrading at 96%.
daily_limits:
  gemini-3.5-flash: 10000

# --- Paths -------------------------------------------------------------------
paths:
  inputs_dir: "inputs"
  runs_csv: "data/confirmatory/latest/runs.csv"
  spend_ledger: "data/confirmatory/latest/spend_ledger.json"

# --- Analysis / gate knobs ---------------------------------------------------
bootstrap_draws: 2000
power_alpha: 0.05
power_target: 0.80
gate:
  max_cells: 1200         # planned confirmatory grid = 100 tickers x 12 dates
  max_cost_usd: 300.0
