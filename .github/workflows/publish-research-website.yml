name: Publish Research Website
on:
  push:
    branches: [main]
    paths:
      - "public-paper/**"
      - ".github/workflows/publish-research-website.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload only public research site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-paper
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
